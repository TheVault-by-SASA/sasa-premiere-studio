<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body{height:100%;margin:0;padding:0;overflow:hidden}body{background:#1b1b1b;color:#eee;font-family:Arial,sans-serif;font-size:12px}#app{height:100%;display:flex;flex-direction:column;padding:12px;position:relative;overflow:hidden}button,sp-action-button{font-family:Arial,sans-serif;font-size:12px;cursor:pointer;color:#ddd;background:transparent;border:0;border-radius:6px;padding:6px 9px;margin:0;min-width:0}sp-action-button:hover{background:#383838}sp-action-button:disabled{opacity:.35;cursor:default}sp-action-button:focus{outline:1px solid #888}.header{display:flex;flex-direction:row;align-items:center;flex-shrink:0;margin-bottom:8px}.brand{font-size:12px;font-weight:bold;flex:1;color:#d6d6d6}.tools{display:flex;flex-direction:row;align-items:center}.icon{min-width:28px;max-width:28px;min-height:28px;max-height:28px;width:28px;height:28px;padding:0;font-size:18px;text-align:center;display:flex;align-items:center;justify-content:center;border-radius:6px}.tools .icon{margin-left:3px;color:#a7a7a7}.tools .icon:hover{color:#fff}#tooltip{position:absolute;top:43px;right:12px;max-width:260px;background:#eee;color:#202020;padding:7px 10px;border-radius:5px;z-index:20;display:none;font-size:11px;pointer-events:none}.muted,small{color:#999}#status{font-size:10px;color:#9caf9d;max-height:28px;overflow:hidden;margin-bottom:8px;flex-shrink:0}#messages{flex:1;min-height:40px;overflow-y:auto;padding:4px 2px 12px;background:transparent}.message{padding:10px 0;margin:0 0 4px}.message.user{background:#282828;border-radius:10px;padding:10px 12px}.message small{font-size:9px;color:#939393;letter-spacing:.5px}.message-text{white-space:pre-wrap;overflow-wrap:break-word;line-height:1.45;margin-top:5px}.muted{margin:8px 0}#agent-status{font-size:10px;color:#aaa;padding:5px 2px;flex-shrink:0;max-height:30px;overflow:hidden}#agent-error{color:#f2a69b;white-space:pre-wrap;max-height:65px;overflow-y:auto;flex-shrink:0}#agent-error:empty{display:none}#requests{max-height:180px;overflow-y:auto;flex-shrink:0}.request{border:1px solid #806d47;border-radius:7px;padding:10px;margin:6px 0}.request button{background:#383838;margin:4px}.request input{width:100%}.composer{background:#292929;border:1px solid #363636;border-radius:17px;padding:10px 11px 8px;flex-shrink:0}#prompt{display:block;width:100%;height:65px;min-height:48px;max-height:130px;background:#292929;color:#eee;border:0;border-radius:0;outline:none;padding:3px 2px;font-family:Arial,sans-serif;font-size:13px;resize:none;margin:0 0 8px}#prompt:focus{outline:none}.composer-bar{display:flex;flex-direction:row;align-items:center;min-height:32px}.spacer{flex:1;min-width:2px}#model-toggle{display:flex;align-items:center;flex-direction:row;padding:5px 7px;font-size:11px;max-width:235px;min-width:0}#model-name{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}#effort-name{color:#aaa;margin-left:5px;white-space:nowrap}.chevron{font-size:12px;color:#999;margin-left:5px}#send,#stop{min-width:32px;max-width:32px;min-height:32px;max-height:32px;width:32px;height:32px;border-radius:16px;margin-left:5px;background:transparent;color:#8bdda5;font-size:23px;flex-shrink:0}#send:hover,#stop:hover{background:transparent}#stop{font-size:14px;display:none}#model-menu,#pairing,#usage-details{display:none;background:#242424;border:1px solid #393939;border-radius:10px;padding:10px;margin-bottom:8px;flex-shrink:0}#model-menu label,#pairing label{display:block;color:#aaa;font-size:10px;margin:0 0 5px}#model-menu .field{margin-bottom:8px}#model-menu .field:last-child{margin-bottom:0}sp-dropdown{width:100%}#pairing input{width:100%;background:#303030;color:#eee;padding:6px;border:1px solid #555;border-radius:5px}.footer{display:flex;flex-direction:row;align-items:center;flex-shrink:0;padding:5px 2px 0;color:#777;font-size:9px;min-height:23px}#usage-toggle{padding:2px 4px;color:#999;font-size:10px}#usage-details{font-size:10px;color:#aaa;margin:0 0 7px;line-height:1.6}#tokens-note{color:#888}#detail{display:none}.keyboard-hint{margin-left:auto;color:#777;font-size:9px}
/* Keep the native multiline editor; its underline sits outside the clipped surface. */
.composer{background:#202020;border:0;border-radius:8px;padding:10px 10px 7px}
.prompt-surface{height:58px;overflow:hidden;margin-bottom:7px}
#prompt{height:60px;min-height:60px;max-height:60px;margin:0;padding:0;background:#202020;font-size:12px}
.composer-bar{min-height:30px}
.icon-art{display:flex;align-items:center;justify-content:center;flex-shrink:0}
#model-toggle{font-size:9px;padding:2px 0;max-width:190px;min-height:26px}
#model-name,#effort-name{font-size:9px}
#effort-name{color:#999;margin-left:4px}
#send,#stop{min-width:30px;max-width:30px;min-height:30px;max-height:30px;width:30px;height:30px;border-radius:0;border:0;box-shadow:none;margin-left:6px}
#new-session{color:#aaa}
#send,#send:hover,#send:disabled,#stop,#stop:hover,#stop:disabled{background:#202020;border:1px solid #202020;outline:none}
</style></head><body><div id="app">
<div class="header"><span class="brand">SASA · Premiere</span><div class="tools">
<sp-action-button quiet id="new-session" class="icon" title="Nueva sesión" aria-label="Nueva sesión" disabled><div slot="icon" style="fill:#bcbcbc;width:16px;height:16px"><svg viewBox="0 0 24 24" style="width:16px;height:16px"><path d="M6 4h5v2H6v12h12v-5h2v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z M18 2l4 4-10 10-5 1 1-5L18 2Zm0 2.8-8.2 8.2-.3 1.5 1.5-.3 8.2-8.2L18 4.8Z"/></svg></div></sp-action-button>
<sp-action-button quiet id="connection-toggle" class="icon" title="Conectar · Desconectado" aria-label="Conectar · Desconectado" aria-pressed="false"><div slot="icon" id="connection-icon" style="fill:#999999;width:16px;height:16px"><svg viewBox="0 0 24 24" style="width:16px;height:16px"><path d="M11 2h2v10h-2Z M6.2 4.8l1.3 1.6a7 7 0 1 0 9 0l1.3-1.6a9 9 0 1 1-11.6 0Z"/></svg></div></sp-action-button>
<sp-action-button quiet id="agent-connect" class="icon" title="Reconectar con Codex" aria-label="Reconectar con Codex"><div slot="icon" style="fill:#bcbcbc;width:16px;height:16px"><svg viewBox="0 0 24 24" style="width:16px;height:16px"><path d="M20 3v7h-7V8h3.9A7 7 0 0 0 5.3 7l-1.6-1.2A9 9 0 0 1 18 6V3Z M4 21v-7h7v2H7.1A7 7 0 0 0 18.7 17l1.6 1.2A9 9 0 0 1 6 18v3Z"/></svg></div></sp-action-button>
<sp-action-button quiet id="settings-toggle" class="icon" title="Configurar la conexión" aria-label="Configurar la conexión" aria-expanded="false"><div slot="icon" style="fill:#bcbcbc;width:16px;height:16px"><svg viewBox="0 0 24 24" style="width:16px;height:16px"><path d="M3 6h3V4h2v6H6V8H3Z M10 6h11v2H10Z M3 16h11v2H3Z M16 14h2v2h3v2h-3v2h-2Z"/></svg></div></sp-action-button>
</div></div>
<div id="tooltip" role="tooltip"></div><div id="status">Preparando conexión…</div>
<div id="pairing"><label for="token">Clave de conexión alternativa</label><input id="token" type="password" placeholder="Solo para emparejar manualmente"></div>
<div id="messages"><p class="muted">¿Qué quieres editar?</p></div>
<div id="agent-status">Conectando con Codex…</div><div id="agent-error"></div><div id="requests"></div>
<div id="model-menu"><div class="field"><label>Modelo</label><sp-dropdown id="model" placeholder="Seleccionar modelo" disabled><sp-menu id="model-options" slot="options"></sp-menu></sp-dropdown></div><div class="field"><label>Razonamiento</label><sp-dropdown id="effort" placeholder="Seleccionar nivel" disabled><sp-menu id="effort-options" slot="options"></sp-menu></sp-dropdown></div></div>
<div id="usage-details">Entrada: <span id="tokens-input">—</span> · Salida: <span id="tokens-output">—</span><br>Última petición: <span id="tokens-turn">—</span><div id="tokens-note">Esperando consumo confirmado.</div></div>
<div class="composer"><div class="prompt-surface"><sp-textarea quiet id="prompt" aria-label="Mensaje para Codex" placeholder="¿Qué quieres editar?"></sp-textarea></div>
<div class="composer-bar">
<sp-action-button quiet id="model-toggle" title="Elegir modelo y razonamiento" aria-label="Elegir modelo y razonamiento" aria-expanded="false" disabled><div slot="icon" style="fill:#bcbcbc;width:12px;height:12px"><svg viewBox="0 0 24 24" style="width:12px;height:12px"><path d="m6.3 8.3 5.7 5.7 5.7-5.7 1.4 1.4-7.1 7.1-7.1-7.1Z"/></svg></div><span id="model-name">Codex</span><span id="effort-name"></span></sp-action-button>
<div class="spacer"></div><sp-action-button quiet id="send" class="icon" title="Enviar mensaje · Enter" aria-label="Enviar mensaje" disabled><div slot="icon" style="fill:#8bdda5;width:20px;height:20px"><svg viewBox="0 0 24 24" style="width:20px;height:20px"><path d="M10.5 20V8.6L6.1 13 4 10.9 12 2.9l8 8-2.1 2.1-4.4-4.4V20Z"/></svg></div></sp-action-button><sp-action-button quiet id="stop" class="icon" title="Detener la petición" aria-label="Detener la petición" disabled><div slot="icon" style="fill:#8bdda5;width:20px;height:20px"><svg viewBox="0 0 24 24" style="width:20px;height:20px"><path d="M7 6h10a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1Z"/></svg></div></sp-action-button></div></div>
<div class="footer"><sp-action-button quiet id="usage-toggle" title="Ver el consumo confirmado de esta sesión" aria-expanded="false"><span id="tokens-total">—</span> tokens</sp-action-button><span class="keyboard-hint">Shift + Enter · nueva línea</span></div>
<div id="detail"></div></div><script src="index.js"></script></body></html>
